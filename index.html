<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-icon-color.png" />
    <link rel="apple-touch-icon" href="/logo-icon-color.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17263A" />
    <meta
      name="description"
      content="hRango: HR, attendance, payroll and people operations in one place"
    />
    <title>hRango</title>
    <script>
      // Apply the persisted theme before first paint to avoid a light/dark flash.
      // Mirrors the `hrms-ui` key written by src/stores/ui-store.ts.
      ;(function () {
        try {
          var raw = localStorage.getItem('hrms-ui')
          var theme = raw ? JSON.parse(raw).state.theme : null
          if (theme === 'dark') document.documentElement.classList.add('dark')
        } catch (_) {
          /* storage unavailable: keep the light default */
        }
      })()
    </script>
    <style>
      /*
       * First-load screen (inside #root, replaced when React mounts): the Pegasus loader of
       * src/components/feedback/brand-loader.tsx in plain CSS, before the app's styles load.
       */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin: 0;
        background: #f1f5f9;
        color: #17263a;
        font:
          700 22px/1 Poppins,
          system-ui,
          sans-serif;
      }
      html.dark .boot {
        background: #0d141f;
        color: #ffffff;
      }
      .boot-mark {
        position: relative;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        width: 96px;
        height: 96px;
      }
      .boot-mark::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        box-shadow: inset 0 0 0 4px rgb(139 92 246 / 0.13);
        background: radial-gradient(circle, rgb(139 92 246 / 0.14), transparent 68%);
      }
      .boot-spin {
        position: absolute;
        inset: 0;
        animation: boot-spin 1.1s linear infinite;
      }
      .boot-spin::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg 120deg,
          rgb(139 92 246 / 0.22) 220deg,
          #8b5cf6 335deg,
          #c4b5fd 360deg
        );
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 4px),
          #000 calc(100% - 3.5px)
        );
        mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px));
      }
      .boot-spin::after {
        content: '';
        position: absolute;
        top: -1.8px;
        left: 50%;
        width: 7.6px;
        height: 7.6px;
        margin-left: -3.8px;
        border-radius: 50%;
        background: #ddd6fe;
        box-shadow: 0 0 8px 2px #8b5cf6;
      }
      .boot-mark img {
        position: relative;
        width: 54px;
        height: auto;
        animation: boot-glide 1.8s ease-in-out infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-glide {
        0%,
        100% {
          transform: translateY(7%) rotate(-4deg);
        }
        50% {
          transform: translateY(-9%) rotate(3deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark img {
          animation: none;
        }
        .boot-spin {
          animation-duration: 1.5s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading hRango">
        <div class="boot-mark">
          <span class="boot-spin"></span>
          <img src="/logo-icon-color.png" alt="" width="472" height="345" />
        </div>
        <span aria-hidden="true">hRango</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
