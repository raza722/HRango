<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-icon-color.png" />
    <link rel="apple-touch-icon" href="/logo-icon-color.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17263A" />
    <meta
      name="description"
      content="hRango: HR, attendance, payroll and people operations in one place"
    />
    <title>hRango</title>
    <script>
      // Apply the persisted theme before first paint to avoid a light/dark flash.
      // Mirrors the `hrms-ui` key written by src/stores/ui-store.ts.
      ;(function () {
        try {
          var raw = localStorage.getItem('hrms-ui')
          var theme = raw ? JSON.parse(raw).state.theme : null
          if (theme === 'dark') document.documentElement.classList.add('dark')
        } catch (_) {
          /* storage unavailable: keep the light default */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
